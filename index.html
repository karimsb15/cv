<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karim | Backend & Automation Developer</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-primary: #c9d1d9;
            --accent-color: #58a6ff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 650px;
            padding: 2.5rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        h1 {
            color: #ffffff;
            margin-top: 0;
            font-size: 2rem;
        }

        p {
            line-height: 1.6;
            color: #8b949e;
        }

        .btn {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.75rem 1.25rem;
            background-color: var(--accent-color);
            color: #0d1117;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #79c0ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hi, I'm Karim 👋</h1>
        <p>Backend & Automation Developer specializing in Python, Django, and Web Automation frameworks.</p>
        <a href="https://github.com/karimsb15" class="btn">View GitHub Profile</a>
    </div>
</body>
</html>
